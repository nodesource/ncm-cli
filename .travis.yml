sudo: false
language: node_js
node_js:
  - "8"
  - "10"
  - "12"
  - "14"
  - "16"
  - "18"
matrix:
  include:
    - node_js: "19"
      env: "NVM_NODEJS_ORG_MIRROR=https://nodejs.org/download/nightly"
  allow_failures:
    # Allow the nightly installs to fail
    - env: "NVM_NODEJS_ORG_MIRROR=https://nodejs.org/download/nightly"
script:
  - npm run test
